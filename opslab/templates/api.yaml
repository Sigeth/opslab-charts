{{- $name := "api" -}}
{{- $secret := .Values.api.signingKeySecret | default "opslab-api-signing-key" -}}
{{- if not .Values.api.signingKeySecret }}
{{- /* Keep the generated key across upgrades: tokens and the gateway's keys stay valid. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "opslab.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $existing }}
  key.pem: {{ index $existing.data "key.pem" }}
  {{- else }}
  key.pem: {{ genPrivateKey "ed25519" | b64enc }}
  {{- end }}
---
{{- end }}
{{- if not .Values.solo.passwordSecret }}
{{- $solo := lookup "v1" "Secret" .Release.Namespace "opslab-solo" }}
apiVersion: v1
kind: Secret
metadata:
  name: opslab-solo
  namespace: {{ .Release.Namespace }}
  labels: {{- include "opslab.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if $solo }}
  password: {{ index $solo.data "password" }}
  {{- else }}
  password: {{ randAlphaNum 20 | b64enc }}
  {{- end }}
---
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.api.databaseSecret) }}
{{- fail "api.databaseSecret is required when postgres.enabled is false" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opslab-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opslab.labels" . | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
spec:
  replicas: {{ include "opslab.replicas" . }}
  selector:
    matchLabels: {{- include "opslab.selector" (dict "root" . "name" $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opslab.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ $name }}
    spec:
      serviceAccountName: opslab-api
      securityContext: {{- include "opslab.podSecurityContext" . | nindent 8 }}
      nodeSelector:
        kubernetes.io/arch: amd64
      initContainers:
        # The web image only carries the built UI: copy it next to the api.
        - name: web
          image: {{ include "opslab.image" (dict "root" . "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [cp, -r, /dist/., /web/]
          volumeMounts:
            - {name: web, mountPath: /web}
          securityContext: {{- include "opslab.containerSecurityContext" . | nindent 12 }}
      containers:
        - name: api
          image: {{ include "opslab.image" (dict "root" . "name" $name) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - {name: OPSLAB_LISTEN, value: "0.0.0.0:8080"}
            - {name: OPSLAB_WEB_DIR, value: /web}
            - {name: OPSLAB_SIGNING_KEY_FILE, value: /etc/opslab/signing-key/key.pem}
            - {name: OPSLAB_LOG_FORMAT, value: json}
            - {name: OPSLAB_DATABASE_URL_FILE, value: /etc/opslab/database/url}
            - {name: OPSLAB_INSTANCES_NAMESPACE, value: {{ .Values.instancesNamespace.name }}}
            - {name: OPSLAB_SYSTEM_NAMESPACE, value: {{ .Release.Namespace }}}
            - {name: OPSLAB_GATEWAY_URL, value: {{ include "opslab.gatewayURL" . | quote }}}
            - {name: OPSLAB_ALLOWED_ORIGINS, value: {{ include "opslab.allowedOrigins" . | quote }}}
            - {name: OPSLAB_COOKIE_SECURE, value: {{ .Values.api.cookieSecure | quote }}}
            - {name: OPSLAB_SOLO_USERNAME, value: {{ .Values.solo.username | quote }}}
            - {name: OPSLAB_SOLO_PASSWORD_FILE, value: /etc/opslab/solo/password}
          ports:
            - {name: http, containerPort: 8080}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          volumeMounts:
            - {name: web, mountPath: /web, readOnly: true}
            - {name: signing-key, mountPath: /etc/opslab/signing-key, readOnly: true}
            - {name: database, mountPath: /etc/opslab/database, readOnly: true}
            - {name: solo, mountPath: /etc/opslab/solo, readOnly: true}
          securityContext: {{- include "opslab.containerSecurityContext" . | nindent 12 }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
      volumes:
        - name: web
          emptyDir: {}
        - name: signing-key
          secret:
            secretName: {{ $secret }}
        - name: database
          secret:
            secretName: {{ .Values.api.databaseSecret | default "opslab-postgres" }}
            items: [{key: url, path: url}]
        - name: solo
          secret:
            secretName: {{ .Values.solo.passwordSecret | default "opslab-solo" }}
            items: [{key: password, path: password}]
---
apiVersion: v1
kind: Service
metadata:
  name: opslab-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "opslab.labels" . | nindent 4 }}
spec:
  selector: {{- include "opslab.selector" (dict "root" . "name" $name) | nindent 4 }}
  ports:
    - {name: http, port: {{ .Values.api.service.port }}, targetPort: http}
