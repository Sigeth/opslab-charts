{{- if .Values.httpRoute.enabled }}
{{- if or (not .Values.httpRoute.hostname) (not .Values.httpRoute.gatewayHostname) (not .Values.httpRoute.parentRefs) }}
{{- fail "httpRoute.enabled requires hostname, gatewayHostname and parentRefs" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opslab-api
  namespace: {{ .Release.Namespace }}
  labels: {{- include "opslab.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.httpRoute.hostname | quote }}]
  rules:
    - backendRefs:
        - {name: opslab-api, port: {{ .Values.api.service.port }}}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opslab-gateway
  namespace: {{ .Release.Namespace }}
  labels: {{- include "opslab.labels" . | nindent 4 }}
spec:
  parentRefs: {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  hostnames: [{{ .Values.httpRoute.gatewayHostname | quote }}]
  rules:
    - backendRefs:
        - {name: opslab-gateway, port: {{ .Values.gateway.service.port }}}
{{- end }}
